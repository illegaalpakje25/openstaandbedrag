<!DOCTYPE html>
<html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Beheer | Klantportaal</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><header><div class="header-inner"><a class="brand" href="/"><img class="company-logo" src="logo.png" alt="Amac"><span class="brand-divider"></span><span class="portal-name">Beheerportaal</span></a><a href="/" class="portal-return">Naar website →</a></div></header>
<main class="admin-main"><section id="loginPanel" class="login-panel" hidden><span class="eyebrow">BEHEERPORTAAL</span><h1>Welkom terug</h1><p class="modal-sub">Log in om uw portaal te openen.</p><form id="loginForm"><label for="username">Gebruikersnaam</label><input id="username" name="username" autocomplete="username" required maxlength="100"><label for="password">Wachtwoord</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024"><button class="primary-button" id="loginSubmit" type="submit">Inloggen <span>→</span></button></form></section>
<p id="message" role="status" aria-live="polite">Portaal laden…</p>
<section id="portalPanel" hidden><div class="admin-heading"><div><span class="eyebrow">BEHEERPORTAAL</span><h1>Uw portaal</h1><p class="modal-sub">Ingelogd als <strong id="accountName"></strong></p></div><button id="logout" class="logout-button">Uitloggen</button></div><div class="side-card"><h2>Factuuroverzicht</h2><dl><div><dt>Factuurnummer</dt><dd id="invoiceNumber"></dd></div><div><dt>Omschrijving</dt><dd id="invoiceDescription"></dd></div><div><dt>Openstaand bedrag</dt><dd id="invoiceAmount"></dd></div><div><dt>Status</dt><dd id="invoiceStatus"></dd></div></dl></div></section></main><script src="beheer.js"></script></body></html>
