<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Foto maken | Klantportaal</title><link rel="stylesheet" href="style.css"></head><body><header><div class="header-inner"><a class="brand" href="/"><img class="company-logo" src="logo.png" alt="Amac"><span class="brand-divider"></span><span class="portal-name">Klantportaal</span></a></div></header><main class="admin-main"><section class="side-card"><span class="eyebrow">FOTO MAKEN</span><h1>Maak uw foto</h1><p class="modal-sub">Open uw camera en maak een foto. U kunt de foto daarna bekijken en zelf kiezen om deze in het beheerportaal op te slaan. De beheerder kan een verstuurde foto bekijken.</p><video id="captureVideo" class="capture-video" autoplay playsinline muted hidden></video><button id="openCamera" class="primary-button" type="button">Camera openen</button><div class="upload-actions"><button id="takePhoto" class="primary-button" type="button" hidden>Foto maken</button><button id="stopCamera" class="logout-button" type="button" hidden>Camera sluiten</button></div><p id="captureStatus" class="modal-sub" role="status" aria-live="polite"></p><a class="portal-return" href="/">Terug naar overzicht →</a></section></main><script src="/photo-upload.js"></script><script src="/foto.js"></script></body></html>
